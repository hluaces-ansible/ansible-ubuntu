---

# Roles never read another role's variables, so the provisioned user each
# one works on is fed to them from here
system_user_name: "{{ provisioned_user }}"
ghostty_user: "{{ provisioned_user }}"

# Terminal role that registers itself as the default x-terminal-emulator
ghostty_set_default: true

sysctl_extra_configuration:
  # IDEs, Electron apps and trackers exhaust the stock 128 instances
  'fs.inotify.max_user_instances':
    value: 1024
