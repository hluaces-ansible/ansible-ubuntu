---
- name: 'Converge'
  hosts: 'ubuntu_group'
  become: false
  gather_facts: true
  vars:
    system_user_name: 'provisioned'
    system_user_password: 'provisioned'
    system_user_groups: ['sudo', 'input']
  pre_tasks:
    # udev ships it on a real host, the container image does not
    - name: 'Create the input group the container image lacks'
      become: true
      ansible.builtin.group:
        name: 'input'
        state: 'present'
  roles:
    - 'hluaces.ubuntu.system_user'
