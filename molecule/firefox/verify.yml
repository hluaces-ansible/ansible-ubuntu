---
- name: 'Verify'
  hosts: 'ubuntu_group'
  become: true
  gather_facts: false
  tasks:
    - name: 'Gather package facts'
      ansible.builtin.package_facts:

    - name: 'Read the apt pin and the unattended-upgrades allow file'
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: firefox_apt_files
      loop:
        - '/etc/apt/preferences.d/mozilla'
        - '/etc/apt/apt.conf.d/51unattended-upgrades-firefox'
        - '/etc/apt/sources.list.d/mozilla.sources'

    - name: 'Report the installed firefox origin'
      ansible.builtin.command:
        cmd: 'apt-cache policy firefox'
      changed_when: false
      register: firefox_policy

    - name: 'Assert firefox came from the Mozilla repository'
      ansible.builtin.assert:
        that:
          - "'firefox' in ansible_facts.packages"
          - "'Pin-Priority: 1000' in firefox_apt_files.results[0].content | b64decode"
          - "'packages.mozilla.org' in firefox_apt_files.results[1].content | b64decode"
          - "'packages.mozilla.org' in firefox_apt_files.results[2].content | b64decode"
          - "'packages.mozilla.org' in firefox_policy.stdout"
        fail_msg: 'firefox not installed from the Mozilla repository'
        success_msg: 'firefox installed from the pinned Mozilla repository'
