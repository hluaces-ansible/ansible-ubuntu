---
name: Test
run-name: Test for ${{ github.event_name }}:${{ github.ref }} (${{ github.sha }})
"on":
  pull_request:
  push:
    branches: main
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scenarios: ${{ steps.map.outputs.scenarios }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Map changed files to scenarios
        id: map
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -o pipefail
          if [ "${EVENT_NAME}" = "schedule" ]; then
            scenarios=$(.github/scripts/map_scenarios.sh schedule < /dev/null)
          elif [ "${EVENT_NAME}" = "push" ] && [ "${PUSH_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            # Branch-creation push has no comparable range: run everything.
            scenarios=$(.github/scripts/map_scenarios.sh fallback < /dev/null)
          else
            if [ "${EVENT_NAME}" = "pull_request" ]; then
              url="https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100"
              jq_expr='.[].filename'
            else
              url="https://api.github.com/repos/${REPO}/compare/${PUSH_BEFORE}...${PUSH_AFTER}"
              jq_expr='.files[].filename'
            fi

            files=$(curl -sf --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${url}" | jq -r "${jq_expr}")

            if [ -z "${files}" ]; then
              scenarios='[]'
            elif [ "$(printf '%s\n' "${files}" | wc -l)" -ge 100 ]; then
              # A 100-file page means the list may be truncated: run everything.
              scenarios=$(.github/scripts/map_scenarios.sh fallback < /dev/null)
            else
              scenarios=$(printf '%s\n' "${files}" | .github/scripts/map_scenarios.sh "${EVENT_NAME}")
            fi
          fi
          echo "Selected scenarios: ${scenarios}"
          echo "scenarios=${scenarios}" >> "${GITHUB_OUTPUT}"

  Test:
    needs: scenarios
    if: needs.scenarios.outputs.scenarios != '[]'
    runs-on: self-hosted
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.scenarios.outputs.scenarios) }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      ################
      # Bootstrapping
      ################
      - name: Init variables
        run: |
          # Ephemeral storage
          MOLECULE_EPHEMERAL_DIRECTORY="${GITHUB_WORKSPACE}/.molecule_ephemeral/${{ matrix.host }}"
          echo "MOLECULE_EPHEMERAL_DIRECTORY=${MOLECULE_EPHEMERAL_DIRECTORY}" >> "${GITHUB_ENV}"
          mkdir -p "${MOLECULE_EPHEMERAL_DIRECTORY}"

          DEFAULT_VAULT_PASSWORD_FILE="${MOLECULE_EPHEMERAL_DIRECTORY}/.default.vault"
          echo "DEFAULT_VAULT_PASSWORD_FILE=${DEFAULT_VAULT_PASSWORD_FILE}" >> "${GITHUB_ENV}"

          # Runner slot drives the libvirt namespace; an unparseable name must fail
          # loudly, not fall back to a shared default slot.
          if [[ "${RUNNER_NAME}" =~ ^runner-([0-9]+)- ]]; then
            echo "MOLECULE_RUNNER_SLOT=${BASH_REMATCH[1]}" >> "${GITHUB_ENV}"
          else
            echo "::error::Cannot derive runner slot from RUNNER_NAME='${RUNNER_NAME}'"
            exit 1
          fi

      - name: Enable APT cache proxy when available
        run: |
          # VMs reach the same daemon via their libvirt gateway IP.
          if curl -sf --max-time 3 http://localhost:3142/acng-report.html > /dev/null; then
            echo "MOLECULE_APT_PROXY=1" >> "${GITHUB_ENV}"
            echo "apt-cacher-ng detected, enabling VM apt proxy"
          else
            echo "apt-cacher-ng not reachable, VMs will download directly"
          fi

      - name: Bootstrap environment
        uses: ./.github/actions/bootstrap
        with:
          vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          vault-file: ${{ env.DEFAULT_VAULT_PASSWORD_FILE }}

      - name: Set up Ansible homedir and show tools versions
        run: ansible --version && virsh --version

      - name: Run molecule test
        run: make test TEST_ARGS="-s ${{ matrix.host }}"

      ################
      # Artifacts
      ################
      - name: Clean up molecule resources
        if: always()
        run: molecule destroy -s "${{ matrix.host }}"

      - name: Upload ansible logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ansible-${{ matrix.host }}.log
          path: config/tmp/ansible.log
          retention-days: 14
          if-no-files-found: error

  test-results:
    needs: [scenarios, Test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on matrix outcome
        env:
          SCENARIOS_RESULT: ${{ needs.scenarios.result }}
          TEST_RESULT: ${{ needs.Test.result }}
        run: |
          if [ "${SCENARIOS_RESULT}" != "success" ]; then
            echo "::error::scenarios job result: ${SCENARIOS_RESULT}"
            exit 1
          fi
          # "skipped" = empty scenario list, which is a legitimate pass.
          if [ "${TEST_RESULT}" = "success" ] || [ "${TEST_RESULT}" = "skipped" ]; then
            echo "Test matrix result: ${TEST_RESULT}"
          else
            echo "::error::Test matrix result: ${TEST_RESULT}"
            exit 1
          fi
