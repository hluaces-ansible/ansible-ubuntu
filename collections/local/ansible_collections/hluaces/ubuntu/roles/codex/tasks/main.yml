---

- name: 'Install the Node.js runtime Codex needs'
  become: true
  ansible.builtin.apt:
    name:
      - 'nodejs'
      - 'npm'
    state: 'present'
    update_cache: true
    cache_valid_time: 3600

- name: 'Install the Codex CLI'
  become: true
  community.general.npm:
    name: '@openai/codex'
    global: true
    state: 'latest'
