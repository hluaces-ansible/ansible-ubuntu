---
argument_specs:
  main:
    short_description: 'Set the system timezone'
    description:
      - 'Sets the system timezone through systemd''s timedatectl.'
    options:
      timezone_name:
        type: 'str'
        default: 'Europe/Madrid'
        description: 'Timezone to set, as an IANA name (e.g. Europe/Madrid).'
